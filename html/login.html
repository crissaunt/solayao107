<body>
    
    <header class="header">
        <div class="flex">
            <a href="#" class="logo">Plants.&#127804;</a>
            <nav class="navbar">
                <a href="#">Home</a>
                <a id="signupToLogout" href="register.html">Sign up</a>
            </nav>
        </div>
    </header>

<main class="wrapper">
        <div class="box-body">
            <div class="box-form">
                <header class="form-header">Log in</header>
                <div id="error-message" class="error-message"></div>
                <form id="loginForm" action="../php/login.php" method="POST">
                      <div class="input-box">
                        <label for="username">Username:</label>
                        <input type="text" id="username" name="username" placeholder="Ex. Alex24">
                        <div class="error" ></div>
                    </div>
                
                    
                    <div class="input-box" style="position: relative;">
                        <label for="password">Password:</label>
                        <input type="password" id="password" name="password" placeholder="Enter your password">
                        <img id="togglePassword1" src="../images/eye-icon.png" style="cursor: pointer; width: 20px;position:absolute; bottom: 27px; top:40px" 
                        class="fas1" onclick="togglePasswordVisibility1('password')">

                        <div class="error-password"><i class='bx bx-error-alt'></i></div>
                    </div>
                    
                    <div class="btn-create-account-container">
                      <button type="submit" name="submit" class="btn-create-account" id="login-button">Login</button>

                    </div>                    
              
                      <p id="forgot-password" style="display:none;font-size: 13px;">Forgot your password? <a href="forgot-password.html" style="color:rgb(0, 81, 255);">Click here.</a></p>
                
                  </form>

        </div>

        <div class="already-account">
            <p>Don't have Account?<a id="registerLink" href="register.html"> Click to Register</a></p>
        </div>
</main>
